# Production packages: published scheduling library.
[package]
name = "ic-jobs"
version = "0.35.2"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

# Keep the published scheduling model platform-neutral: Serde only, with no
# Candid, CDK, Memory or Timers dependency. Consumers own those integrations.
[dependencies]
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
serde_test.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
