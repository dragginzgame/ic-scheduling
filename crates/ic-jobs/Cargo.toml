[package]
name = "ic-jobs"
version = "0.37.6"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
calendar = ["dep:saffron", "dep:chrono"]
execution = ["calendar", "dep:ic-timers", "dep:ic-platform-runtime"]

[dependencies]
chrono = { workspace = true, optional = true }
saffron = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, optional = true }
ic-timers = { workspace = true, optional = true }

[lints]
workspace = true
