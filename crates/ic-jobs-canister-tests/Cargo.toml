# Native artifact capture with an explicitly enabled recovery harness and queue client.
[package]
name = "ic-jobs-canister-tests"
version = "0.34.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Explicitly enable the native recovery transport and queue example.
harness = [
    "dep:ic-jobs-test-consumer",
    "dep:ic-platform-types",
    "dep:ic-testkit",
    "dep:ic-wire",
    "dep:serde",
]

[dependencies]
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build.workspace = true
ic-host-process.workspace = true
# Disabled for ordinary artifact-capture builds.
ic-jobs-test-consumer = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true, features = ["principal-external", "principal-self-authenticating"] }
ic-testkit = { workspace = true, optional = true, features = ["wire"] }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
ctrlc.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }

[[example]]
name = "queue"
required-features = ["harness"]

[[test]]
name = "recovery"
required-features = ["harness"]

[[test]]
name = "queue_cli"
required-features = ["harness"]

[lints]
workspace = true
