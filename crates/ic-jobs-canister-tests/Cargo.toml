# Native artifact capture with an explicitly enabled recovery harness.
[package]
name = "ic-jobs-canister-tests"
version = "0.34.16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[package.metadata.shared-tooling.loc.paths]
"src/bin/tests" = "tests"
"src/harness.rs" = "tests"
"tests" = "tests"

[features]
default = []
# Explicitly enable the native recovery transport.
harness = [
    "dep:ic-jobs-test-consumer",
    "dep:ic-platform-types",
    "dep:ic-testkit",
    "dep:ic-wire",
    "dep:serde",
]

[dependencies]
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build.workspace = true
ic-host-process.workspace = true
# Disabled for ordinary artifact-capture builds.
ic-jobs-test-consumer = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true, features = ["principal-external"] }
ic-testkit = { workspace = true, optional = true, features = ["wire"] }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-platform-types = { workspace = true, features = ["principal-self-authenticating"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
toko-tooling.workspace = true

[[test]]
name = "recovery"
required-features = ["harness"]

[lints]
workspace = true
