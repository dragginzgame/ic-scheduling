[package]
name = "ic-timers"
links = "ic-timers-global-timer"
version = "0.46.17"
description = "Isolated async timers and prearmed watchdogs for Internet Computer canisters"
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
metrics = ["dep:ic-metrics"]

[dependencies]
ic-metrics = { workspace = true, optional = true }
ic-platform-runtime.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
