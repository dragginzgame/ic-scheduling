[package]
name = "ic-timers"
rust-version.workspace = true
edition.workspace = true
version = "0.44.2"
license-file.workspace = true
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Observable and recovery-aware timers for Internet Computer canisters"
repository.workspace = true
documentation = "https://docs.rs/ic-timers"
keywords = ["internet-computer", "canister", "timer", "dfinity", "icp"]
categories = ["asynchronous", "wasm"]
readme = "README.md"
publish = true
links = "ic-timers-global-timer"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-metrics.workspace = true
ic-platform-runtime = { workspace = true, features = ["executor", "ic0"] }
thiserror.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

# Cargo cannot merge inherited and package lint tables. Timers mirrors the
# common minimum, but admits only its private FFI under unsafe_code=deny;
# the safe product and qualification workspaces retain unsafe_code=forbid.
[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
needless_pass_by_value = "warn"
wildcard_imports = "warn"
too_many_lines = "allow"
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
