[package]
name = "ic-timers-pocketic"
rust-version.workspace = true
edition.workspace = true
version = "0.41.3"
publish = false
license.workspace = true

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[package.metadata.shared-tooling.loc.paths]
"src/build/tests.rs" = "tests"
"src/report/tests.rs" = "tests"
"src/tests.rs" = "tests"
"tests" = "tests"

[dependencies]
clap = { workspace = true, features = ["derive"] }
ic-build.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-platform-types = { workspace = true, features = ["principal-external"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-timers-test-protocol.workspace = true
ic-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
