name: Scheduling recovery
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}
concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Record selected source and graph
        run: |
          evidence="$RUNNER_TEMP/jobs-recovery"
          mkdir "$evidence"
          {
            printf 'commit=%s\nref=%s\nrun=%s\nattempt=%s\n' \
              "$(git rev-parse HEAD)" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            uname -sm
          } > "$evidence/source.txt"
          cp Cargo.toml Cargo.lock rust-toolchain.toml "$evidence/"
          mkdir "$evidence/qualification"
          cp qualification/Cargo.toml qualification/Cargo.lock "$evidence/qualification/"
          cp .toko-tooling.snapshot "$evidence/toko-tooling.snapshot"
      - name: Restore pinned tool downloads
        id: restore-downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Prepare host parsers for Rust policy selection
        id: host-tools
        run: make install-host-tools
      - name: Read the declared compiler policy
        id: rust-policy
        run: |
          export PATH="$PWD/.tools/host/bin:$PATH"
          toolchain="$(bash scripts/dev/minimum-rust.sh --print)"
          printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"
      - name: Prepare the declared compiler once
        id: rust-setup
        run: bash scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
      - name: Record prepared toolchain identities
        run: |
          {
            bash scripts/dev/minimum-rust.sh --check
          } > "$RUNNER_TEMP/jobs-recovery/toolchains.txt"
      - name: Prepare and admit the complete common toolset
        id: selected-tools
        run: |
          make install-tools 2>&1 | tee "$RUNNER_TEMP/tools-common-setup.log"
          make tools-check 2>&1 | tee "$RUNNER_TEMP/tools-common-check.log"
          make toko-tooling-check check-pins
      - name: Save pinned tool downloads
        id: save-downloads
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Prepare the selected dependency cache
        run: |
          cargo fetch --locked 2>&1 | tee "$RUNNER_TEMP/tools-dependency-cache.log"
          cargo fetch --manifest-path qualification/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/qualification-dependency-cache.log"
      - name: Prepare and admit the selected Testkit CLI
        id: testkit
        run: |
          make install-testkit-tools 2>&1 | tee "$RUNNER_TEMP/tools-testkit-setup.log"
          cli="$(make --silent --no-print-directory testkit-tools-check \
            2> >(tee "$RUNNER_TEMP/tools-testkit-check-stderr.log" >&2) \
            | tee "$RUNNER_TEMP/tools-testkit-check.log")"
          cp "${cli%/bin/*}/selection.json" "$RUNNER_TEMP/jobs-recovery/testkit-selection.json"
      - name: Prepare and admit the Testkit-owned PocketIC bundle
        run: |
          make install-consumer-server 2>&1 | tee "$RUNNER_TEMP/tools-pocketic-setup.log"
          make consumer-server-check 2>&1 | tee "$RUNNER_TEMP/tools-pocketic-check.log"
      - name: Qualify live canister recovery
        id: live
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          make test-canister-optimized 2>&1 | tee "$RUNNER_TEMP/jobs-recovery/test.log"
          make test-timer-watchdog 2>&1 | tee "$RUNNER_TEMP/jobs-recovery/timer-watchdog.log"
          make test-timer-cohorts 2>&1 | tee "$RUNNER_TEMP/jobs-recovery/timer-cohorts.log"
      - name: Record live gate outcome
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs-recovery"
          printf 'live-outcome=%s\n' "$LIVE_OUTCOME" > "$RUNNER_TEMP/jobs-recovery/outcome.txt"
      - name: Retain recovery evidence on every outcome
        id: recovery-evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jobs-recovery-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jobs-recovery/
            ${{ runner.temp }}/jobs-recovery.*/
            ${{ runner.temp }}/timer-qualification-*/
            ${{ github.workspace }}/target/timer-cohorts.json
            ${{ runner.temp }}/tools-*.log
          retention-days: 14
          if-no-files-found: error
      - name: Retain failed setup and tool evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: jobs-recovery-tools-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
          ic-tools: 'wasm-opt'
