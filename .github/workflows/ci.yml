name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}
concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Prepare the pinned secret scanner
        id: gitleaks
        run: |
          binary="$(bash scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/ci-bin")"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Save pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan repository history for secrets
        id: scan-secrets
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.binary }}
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'

  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the exact tested change
        id: classify
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: |
          scope="$(perl scripts/ci/classify-ci-change.pl --event "$CHANGE_EVENT" --ref "$CHANGE_REF" \
            --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --policy ci/docs-only-paths.txt)"
          case "$scope" in docs|full) ;; *) exit 1 ;; esac
          if [[ "$scope" == docs ]]; then
            git diff --check "$CHANGE_BASE...$CHANGE_HEAD" --
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  validate:
    needs: change-scope
    # Retain every required host/check name even if classification fails.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Require successful change classification
        id: classification-admission
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-scope.result }}
        run: test "$CLASSIFICATION_RESULT" = success
      - name: Restore pinned tool downloads
        id: restore-downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Prepare host parsers for Rust policy selection
        id: host-tools
        run: make install-host-tools
      - name: Save documentation tool downloads
        id: save-doc-downloads
        if: needs.change-scope.outputs.scope == 'docs'
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Check documentation-only changes
        id: documentation
        if: needs.change-scope.outputs.scope == 'docs'
        run: |
          export PATH="$PWD/.tools/host/bin:$PATH"
          make host-tools-check toko-tooling-check check-doc-links
          echo 'Documentation-only checks passed; native qualification was not selected.' >> "$GITHUB_STEP_SUMMARY"
      - name: Read the declared compiler policy
        id: rust-policy
        if: needs.change-scope.outputs.scope != 'docs'
        run: |
          export PATH="$PWD/.tools/host/bin:$PATH"
          toolchain="$(bash scripts/dev/minimum-rust.sh --print)"
          printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"
      - name: Prepare the declared compiler once
        id: rust-setup
        if: needs.change-scope.outputs.scope != 'docs'
        run: bash scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
      - name: Prepare the complete selected toolset
        id: selected-tools
        if: needs.change-scope.outputs.scope != 'docs'
        run: make install-tools
      - name: Save pinned tool downloads
        id: save-downloads
        if: needs.change-scope.outputs.scope != 'docs'
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Check prepared tools offline
        if: needs.change-scope.outputs.scope != 'docs'
        run: make tools-check
      - name: Prepare selected dependency cache
        if: needs.change-scope.outputs.scope != 'docs'
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path qualification/Cargo.toml --locked
      - name: Prepare the lock-selected release metadata editor
        if: needs.change-scope.outputs.scope != 'docs'
        run: make install-release-tools
      - name: Validate the selected graph
        id: validate
        if: needs.change-scope.outputs.scope != 'docs'
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          make ci
      - name: Retain failed formatting and tool evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: jobs-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
          ic-tools: 'wasm-opt'
