[workspace]
members = [
    "ic-jobs-canister-tests",
    "ic-jobs-test-consumer",
    "ic-timers-pocketic",
    "ic-timers-runtime-probe",
    "ic-timers-size-probe",
    "ic-timers-test-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
# Current product source; qualification is not a product release group.
ic-jobs = { path = "../crates/ic-jobs" }
ic-timers = { path = "../crates/ic-timers" }

ic-jobs-canister-tests = { path = "ic-jobs-canister-tests" }
ic-jobs-test-consumer = { path = "ic-jobs-test-consumer" }
ic-timers-test-protocol = { path = "ic-timers-test-protocol" }

ic-metrics = { version = "0.30.0", default-features = false }
ic-platform-runtime = { version = "0.22.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }

clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-build = "0.84.1"
ic-host-artifacts = "0.77.0"
ic-host-fs = { version = "0.77.0", default-features = false }
ic-host-process = { version = "0.77.0", default-features = false }
ic-platform-types = { version = "0.20.1", default-features = false }
ic-storage = "0.74.0"
ic-testkit = "0.102.0"
ic-wire = "0.22.0"
ic-wire-endpoint = "0.13.0"
serde_json = "1.0"
tokio = { version = "1", default-features = false }
toko-tooling = "=0.41.1"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

# Preserve the Timers probes' qualified optimization profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
