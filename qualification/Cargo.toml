[workspace]
members = [
    "calendar-probe",
    "executor-driver",
    "executor-probe",
    "metrics-probe",
    "once-driver",
    "once-probe",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
publish = false

[workspace.dependencies]
# Production
ic-jobs = { path = "../crates/ic-jobs", default-features = false, features = ["calendar"] }
ic-platform-runtime = { version = "0.23.21", default-features = false, features = ["call-ic0", "system-raw"] }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-testkit = { version = "0.110.0", default-features = false }
ic-timers = { path = "../crates/ic-timers" }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

# Tests and tooling
toko-tooling = "=0.46.5"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
