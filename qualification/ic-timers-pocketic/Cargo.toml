[package]
name = "ic-timers-pocketic"
rust-version.workspace = true
edition.workspace = true
version = "0.41.5"
publish = false
license-file.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "build_tooling"

[package.metadata.toko-tooling.loc.paths]
"src/build/tests.rs" = "tests"
"src/report/tests.rs" = "tests"
"src/tests.rs" = "tests"
"tests" = "tests"

[dependencies]
clap = { workspace = true, features = ["derive"] }
ic-build.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-jobs-canister-tests = { workspace = true, features = ["harness"] }
ic-platform-types.workspace = true
ic-testkit.workspace = true
ic-timers-test-protocol.workspace = true
ic-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
toko-tooling.workspace = true

[lints.rust]
unsafe_code = "forbid"
