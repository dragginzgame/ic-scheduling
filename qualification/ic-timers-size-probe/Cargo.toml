[package]
name = "ic-timers-size-probe"
rust-version.workspace = true
edition.workspace = true
version = "0.41.5"
publish = false
license-file.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
default = ["baseline"]
baseline = []
once = []
after-completion = []
watchdog = []

[dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-timers.workspace = true
ic-timers-test-protocol.workspace = true
ic-wire-endpoint.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints.rust]
unsafe_code = "forbid"
