[workspace]
members = ["crates/ic-jobs", "crates/ic-timers"]
default-members = ["crates/ic-jobs", "crates/ic-timers"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-scheduling"

[workspace.dependencies]
# Jobs
# Changelog : releases/jobs/CHANGELOG.md
ic-jobs = { path = "crates/ic-jobs", version = "0.34.16" }

# Timers
# Changelog : releases/timers/CHANGELOG.md
ic-timers = { path = "crates/ic-timers", version = "0.42.0" }

# Production dependencies
# Metrics and Serde also serve qualification consumers.
ic-metrics = { version = "0.29.0", default-features = false }
ic-platform-runtime = { version = "0.21.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Tests and tooling only
serde_json = "1.0"
serde_test = "1.0"
toko-tooling = "=0.38.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
