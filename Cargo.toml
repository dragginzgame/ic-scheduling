[workspace]
members = ["crates/ic-jobs", "crates/ic-timers"]
default-members = ["crates/ic-jobs", "crates/ic-timers"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-scheduling"

[workspace.dependencies]
ic-metrics = { version = "0.30.0", default-features = false }
ic-platform-runtime = { version = "0.22.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

serde_json = "1.0"
serde_test = "1.0"
toko-tooling = "=0.43.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
