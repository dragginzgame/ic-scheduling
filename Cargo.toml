[workspace]
members = ["crates/ic-jobs", "crates/ic-timers"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
publish = ["crates-io"]
repository = "https://github.com/dragginzgame/ic-scheduling"

[workspace.dependencies]
ic-timers = { version = "0.46.1", path = "crates/ic-timers" }

chrono = { version = "0.4", default-features = false, features = ["alloc"] }
ic-metrics = { version = "=0.30.8", default-features = false }
ic-platform-runtime = { version = "=0.23.15", default-features = false, features = ["call-ic0", "system-raw"] }
saffron = { version = "=0.1.0", default-features = false, features = ["std"] }
toko-tooling = "=0.44.11"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
