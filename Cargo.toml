[workspace]
# Production packages: crates/ic-jobs, crates/ic-timers.
# Remaining members are unpublished consumer, test and qualification packages.
members = [
    "apps/ic-jobs-test-consumer",
    "crates/ic-jobs",
    "crates/ic-jobs-canister-tests",
    "crates/ic-timers",
    "crates/ic-timers-pocketic",
    "crates/ic-timers-runtime-probe",
    "crates/ic-timers-size-probe",
    "crates/ic-timers-test-protocol",
]
default-members = ["crates/ic-jobs", "crates/ic-timers"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-scheduling"

[workspace.dependencies]
# Jobs
# Changelog : releases/jobs/CHANGELOG.md
ic-jobs = { path = "crates/ic-jobs", version = "0.34.5" }
ic-jobs-canister-tests = { path = "crates/ic-jobs-canister-tests", version = "0.34.5" }
ic-jobs-test-consumer = { path = "apps/ic-jobs-test-consumer", version = "0.34.5" }

# Timers
# Changelog : releases/timers/CHANGELOG.md
ic-timers = { path = "crates/ic-timers", version = "0.40.6" }
ic-timers-pocketic = { path = "crates/ic-timers-pocketic", version = "0.40.6" }
ic-timers-runtime-probe = { path = "crates/ic-timers-runtime-probe", version = "0.40.6" }
ic-timers-size-probe = { path = "crates/ic-timers-size-probe", version = "0.40.6" }
ic-timers-test-protocol = { path = "crates/ic-timers-test-protocol", version = "0.40.6" }

# Production dependencies
# Metrics and Serde also serve qualification consumers.
ic-metrics = { version = "0.29.0", default-features = false }
ic-platform-runtime = { version = "0.19.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
ctrlc = "3.5"
ic-build = "0.74.0"
ic-host-artifacts = "0.74.1"
ic-host-fs = { version = "0.74.1", default-features = false }
ic-host-process = { version = "0.74.1", default-features = false }
ic-logging = { version = "0.24.5", default-features = false }
ic-platform-types = { version = "0.18.0", default-features = false }
ic-storage = "0.67.0"
ic-testkit = "0.86.0"
ic-wire = "0.17.0"
ic-wire-endpoint = "0.7.0"
serde_json = "1.0"
serde_test = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Preserve the Timers probes' qualified optimization profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
